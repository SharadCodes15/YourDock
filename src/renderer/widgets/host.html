<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Widget Host</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      position: relative;
    }

    #widget-canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none; /* Mouse forwarding will toggle this */
    }
  </style>
</head>
<body>
  <div id="widget-canvas"></div>
  <script src="host.js"></script>
</body>
</html>
